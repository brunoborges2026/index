<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vetorial Imóveis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 20px; font-weight: bold; font-size: 1.5rem; color: #ff7a00; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">VETORIAL IMÓVEIS</div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3" id="passwordGroup">
            <label for="password" class="form-label" id="passwordLabel">Senha</label>
            <input type="password" class="form-control" id="password" required>
            <small id="passwordHelp" class="text-muted" style="display:none;">Primeiro acesso: Crie sua senha agora.</small>
        </div>
        <button type="submit" class="btn btn-dark w-100" id="loginBtn">Entrar</button>
        <div id="loginMsg" class="mt-3 text-center text-danger" style="display:none;"></div>
    </form>
</div>

<script src="config.js"></script>
<script>
    if (localStorage.getItem('broker_email')) {
        window.location.href = 'dashboard.html';
    }

    let isFirstAccessMode = false;

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('loginMsg');
        const btn = document.getElementById('loginBtn');

        btn.disabled = true;
        msg.style.display = 'block';
        msg.className = "mt-3 text-center text-info";
        msg.innerText = "Verificando...";

        if (isFirstAccessMode) {
            // Setup new password
            const payload = { action: 'setPassword', email: email, password: pass };
            try {
                const data = await apiCall(payload);
                if (data.success) {
                    localStorage.setItem('broker_email', email);
                    window.location.href = 'dashboard.html';
                } else {
                    msg.className = "mt-3 text-center text-danger";
                    msg.innerText = data.error;
                    btn.disabled = false;
                }
            } catch(e) {
                msg.innerText = "Erro de conexão.";
                btn.disabled = false;
            }
            return;
        }

        // Standard Login Check
        const payload = { action: 'login', email: email, password: pass };
        try {
            const data = await apiCall(payload);

            if (data.success) {
                localStorage.setItem('broker_email', email);
                window.location.href = 'dashboard.html';
            } else if (data.isFirstAccess) {
                isFirstAccessMode = true;
                msg.className = "mt-3 text-center text-primary";
                msg.innerText = "Primeiro acesso detectado! Defina sua senha agora.";
                document.getElementById('passwordLabel').innerText = "Crie uma Senha";
                document.getElementById('passwordHelp').style.display = 'block';
                btn.innerText = "Salvar Senha e Entrar";
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                btn.disabled = false;
            } else {
                msg.className = "mt-3 text-center text-danger";
                msg.innerText = data.error;
                btn.disabled = false;
            }
        } catch (e) {
            msg.className = "mt-3 text-center text-danger";
            msg.innerText = "Erro ao conectar com o servidor.";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
